name: Ascend Performance Regression Bot

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "" # explicit cleanup
  PIP_USER: "0" # install into the job venv
  PIP_TIMEOUT: "600"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_HTTP_TIMEOUT: "600"
  XDG_CACHE_HOME: "${{ github.workspace }}/.cache" # to be updated
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip" # to be updated
  UV_CACHE_DIR: "${{ github.workspace }}/.cache/uv" # to be updated
  PRE_COMMIT_HOME: "${{ github.workspace }}/.cache/pip/.pre-commit" # to be updated

jobs:
  permissions-check:
    name: Check bot permissions
    if: |
      github.repository_owner == 'deepseek-ai' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '@ascend-perf-regression'))
    runs-on: [self-hosted, ascend]
    steps:
      - name: Get commenter permission
        id: perm
        uses: actions/github-script@v9
        with:
          script: |
            const username = context.payload.comment.user.login
            const { owner, repo } = context.repo
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username })
            core.setOutput('permission', data.permission) // admin|maintain|write|triage|read|none

      - name: Reject if not allowed
        if: ${{ steps.perm.outputs.permission != 'admin' && steps.perm.outputs.permission != 'maintain' && steps.perm.outputs.permission != 'write' }}
        run: |
          echo "Not authorized: permission=${{ steps.perm.outputs.permission }}"
          exit 1

  pr-regression:
    name: Performance regression test between PR and asc
    needs: [permissions-check]
    runs-on: ${{ matrix.runner.tags }}
    strategy:
      matrix:
        runner:
          - tags: [self-hosted, ascend]
            name: self-hosted-ascend
            toolkit: Ascend
        python-version:
          - "3.12"
      fail-fast: false
    concurrency:
      # Only authorized regression jobs should cancel an older run for the same PR and matrix lane.
      group: "${{ github.workflow }}-${{ github.event.issue.number }}-${{ matrix.runner.name }}-${{ matrix.python-version }}"
      cancel-in-progress: true
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          fetch-depth: 0
          submodules: recursive

      - name: Set environment (self-hosted runners)
        if: startsWith(matrix.runner.name, 'self-hosted')
        run: |
          # Hide sensitive data in logs for self-hosted runners
          if [[ -n "${{ secrets.SECRET_PATH_PREFIXES }}" ]]; then
            echo "::add-mask::${{ secrets.SECRET_PATH_PREFIXES }}"
            # Colon separated list of secrets to mask
            for secret in $(echo "${{ secrets.SECRET_PATH_PREFIXES }}" | tr ':' '\n'); do
              echo "::add-mask::${secret}"
            done
          fi

          # Preserve the runner interpreter before setup-uv changes PATH.
          CI_BASE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          CI_PYTHON_VERSION="$("${CI_BASE_PYTHON}" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [[ "${CI_PYTHON_VERSION}" != "${{ matrix.python-version }}" ]]; then
            echo "::error::Runner Python ${CI_PYTHON_VERSION} does not match requested ${{ matrix.python-version }}"
            exit 1
          fi
          echo "CI_BASE_PYTHON=${CI_BASE_PYTHON}" >> "${GITHUB_ENV}"

          # Use runner tool_cache as cache root for self-hosted runners to avoid internet connection
          # issues and to share cache between jobs.
          export XDG_CACHE_HOME="${{ runner.tool_cache }}/.ci-cache-${{ github.workflow }}"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME}" | tee -a "${GITHUB_ENV}"
          echo "PIP_CACHE_DIR=${XDG_CACHE_HOME}/pip" | tee -a "${GITHUB_ENV}"
          echo "UV_CACHE_DIR=${XDG_CACHE_HOME}/uv" | tee -a "${GITHUB_ENV}"
          echo "PRE_COMMIT_HOME=${XDG_CACHE_HOME}/pip/.pre-commit" | tee -a "${GITHUB_ENV}"

          # PTO toolchain
          export PTO_SOURCE_DIR=/nfs-hg/prod/deepseek/permanent/xuruifan/PTOAS
          export PTO_INSTALL_DIR=${PTO_SOURCE_DIR}/install
          echo "PTO_SOURCE_DIR=${PTO_SOURCE_DIR}" | tee -a "${GITHUB_ENV}"
          echo "PTO_INSTALL_DIR=${PTO_INSTALL_DIR}" | tee -a "${GITHUB_ENV}"
          echo "MLIR_PYTHON_ROOT=/nfs-hg/prod/deepseek/permanent/xuruifan/llvm-project/tools/mlir/python_packages/mlir_core" | tee -a "${GITHUB_ENV}"
          echo "PTO_PYTHON_ROOT=${PTO_INSTALL_DIR}/" | tee -a "${GITHUB_ENV}"
          echo "${PTO_SOURCE_DIR}/build/tools/ptoas:${PTO_SOURCE_DIR}/build/tools/ptobc" | tee -a "${GITHUB_PATH}"

          # CANN runtime env for torch_npu autoload (libascendcl.so, liburma.so.0, ...).
          # The runner daemon does not inherit the container-injected CANN environment,
          # so torch_npu fails to load at `import torch` without this.
          CANN_SET_ENV="$(ls -d /usr/local/Ascend/cann-*/set_env.sh 2>/dev/null | sort | tail -1)"
          if [[ -n "${CANN_SET_ENV}" ]]; then
            # shellcheck disable=SC1090
            source "${CANN_SET_ENV}"
          fi
          # Propagate the assembled CANN + PTO/llvm environment to subsequent steps
          export LD_LIBRARY_PATH="/nfs-hg/prod/deepseek/permanent/xuruifan/llvm-project/lib:${PTO_INSTALL_DIR}/lib:${LD_LIBRARY_PATH}"
          {
            echo "ASCEND_TOOLKIT_HOME=${ASCEND_TOOLKIT_HOME}"
            echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH}"
            echo "ASCEND_OPP_PATH=${ASCEND_OPP_PATH}"
            echo "ASCEND_AICPU_PATH=${ASCEND_AICPU_PATH}"
            echo "TOOLCHAIN_HOME=${TOOLCHAIN_HOME}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
          } | tee -a "${GITHUB_ENV}"

      - name: Setup uv with caching
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: false
          # Do not use cache for self-hosted runners, as it will download/upload caches which is slow.
          enable-cache: ${{ !startsWith(matrix.runner.name, 'self-hosted') }}
          prune-cache: ${{ !startsWith(matrix.runner.name, 'self-hosted') }}
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          ignore-nothing-to-cache: true
          cache-suffix: uv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.runner.name }}-${{ matrix.runner.toolkit }}
          cache-dependency-glob: |
            pyproject.toml
            requirements*.txt

      - name: Setup venv
        id: setup-venv
        run: |
          set -o pipefail

          export PYTHONPATH=""
          export PIP_USER=0

          uv venv --clear --system-site-packages --python "${CI_BASE_PYTHON}" .venv
          source .venv/bin/activate
          export UV_PYTHON="${VIRTUAL_ENV}/bin/python"
          export PIP_CONSTRAINT="${RUNNER_TEMP}/inherited-torch-constraints.txt"
          {
            echo "VIRTUAL_ENV=${VIRTUAL_ENV}"
            echo "UV_PYTHON=${UV_PYTHON}"
            echo "PIP_CONSTRAINT=${PIP_CONSTRAINT}"
          } >> "${GITHUB_ENV}"
          echo "${VIRTUAL_ENV}/bin" >> "${GITHUB_PATH}"

          # Fail early if the runner's Torch stack cannot load, and preserve its versions.
          python - <<'PY'
          import importlib
          import os
          from importlib.metadata import version

          with open(os.environ["PIP_CONSTRAINT"], "w") as constraints:
              for package in ("torch", "torch_npu"):
                  module = importlib.import_module(package)
                  requirement = f"{package}=={version(package)}"
                  constraints.write(f"{requirement}\n")
                  print(f"{requirement} ({module.__file__})")
          PY

          # pip recognizes inherited packages; uv pip would install another Torch copy.
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -v -r requirements-test.txt

      - name: Clear uv cache for self-hosted runners (if setup failed)
        if: >-
          ${{
            failure() &&
            startsWith(matrix.runner.name, 'self-hosted') &&
            (steps.setup-uv.conclusion == 'failure' || steps.setup-venv.conclusion == 'failure')
          }}
        run: |
          echo "Clearing uv cache at ${UV_CACHE_DIR} due to failure."
          uv cache clean

      - name: Run performance regression test
        run: |
          # The script rebuilds libtvm.so via ninja for each ref (baseline = upstream/asc,
          # current = the PR merge), keeps the Ascend examples and maintenance driver
          # constant across both, and writes the speedup table to
          # .perf_regression_ascend/regression_result.md.
          bash ./maint/scripts/run_perf_regression_ascend.sh

      - name: Post test results as PR comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.perf_regression_ascend/regression_result.md';
            const md = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '_No results produced (the run failed before generating a report)._';

            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body =
              'Ascend Performance Regression Test Report\n' +
              '=========================================\n\n' +
              `Triggered by: @${context.payload.comment.user.login}\n` +
              `Workflow run: ${runUrl}\n\n` +
              'Results (speedup = baseline / current, >1.0 means the PR is faster)\n' +
              '-----------------------------------------------------------------\n\n' +
              md + '\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
