name: Dist (Ascend Nightly)
on:
  workflow_dispatch:
  schedule:
    # 20:00 UTC == 4:00 China time, offset from the main Dist workflow (22:00 UTC).
    - cron: "0 20 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - VERSION
      - version_provider.py
      - .github/workflows/dist-ascend.yml
      # Installed by the NPU wheel-test job below.
      - requirements-test.txt
      # Type aliases can affect package import/build behavior.
      - tilelang/_typing.py

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_HTTP_TIMEOUT: "600"
  XDG_CACHE_HOME: "${{ github.workspace }}/.cache" # to be updated
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip" # to be updated
  UV_CACHE_DIR: "${{ github.workspace }}/.cache/uv" # to be updated

jobs:
  build-wheel-ascend:
    name: Build Ascend wheel (abi3, ${{ matrix.target.arch }})
    if: |
      github.repository_owner == 'tile-ai' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per architecture. Python versions are not a matrix
        # axis: wheel.py-api = "cp39" (pyproject.toml) makes every build a
        # single abi3 wheel covering all supported CPython versions, and
        # tilelang has no version-specific extension modules (native libs are
        # dlopen'ed). x86_64 builds in manylinux_2_28, aarch64 in
        # manylinux_2_34 (both set in pyproject.toml); the hosted ARM runner
        # is the same one dist.yml uses.
        target:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    env:
      NO_VERSION_LABEL: "OFF"
      CIBW_BUILD: "cp310-*"
      # Host-side import test only; CPU torch is enough and much smaller.
      UV_TORCH_BACKEND: "cpu"
      # Ascend-only build; these override the fat-wheel defaults from
      # [tool.cibuildwheel.linux].environment in pyproject.toml. CANN is not
      # needed at build time: Ascend uses the vendored ACL declarations and
      # the dlopen-based ascendcl stub (TILELANG_USE_ASCEND_STUBS), so the
      # wheel stays importable on machines without CANN. The date stamp makes
      # each nightly build distinguishable: X.Y.Z+ascend.dYYYYMMDD.gitHASH.
      CIBW_ENVIRONMENT: "USE_CUDA=OFF USE_ROCM=OFF USE_ASCEND=ON TILELANG_BUILD_WHEEL_WITH_DATE=ON"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Python and uv with caching
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: "2GB"
          create-symlink: true
          evict-old-files: "7d"
          append-timestamp: false
          # A commit key covers source, headers, submodules and build settings.
          key: wheel-ascend-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            wheel-ascend-${{ runner.os }}-${{ runner.arch }}

      - name: Set CIBW_BEFORE_BUILD_LINUX
        run: |
          # Fixed dependency paths allow ccache direct hits across runner
          # instances (same approach as dist.yml).
          HOST_CCACHE_DIR="$(ccache --get-config cache_dir)"
          echo "CIBW_BEFORE_BUILD_LINUX=dnf install -y ccache && ccache -o cache_dir=/host${HOST_CCACHE_DIR}" | tee -a "${GITHUB_ENV}"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Test built wheels
        run: |
          for WHEEL in wheelhouse/*.whl; do
            echo "Testing wheel: ${WHEEL}"
            case "${WHEEL}" in
              *+ascend.*) ;;
              *) echo "::error::wheel $(basename "${WHEEL}") is missing the +ascend version label"; exit 1 ;;
            esac
            if [[ "${WHEEL}" == *"abi3"* ]]; then
              uvx abi3audit --verbose --strict "${WHEEL}"
            fi
            (
              set -e
              uv venv test-venv
              source test-venv/bin/activate

              uv pip install -v "${WHEEL}"
              (
                set -e
                cd /
                uv run --no-project -- python -c "import tilelang; print(tilelang.__version__); assert '+ascend' in tilelang.__version__, tilelang.__version__"
              )
              deactivate
              rm -rf test-venv
            )
          done

      - name: Upload wheels
        # Always upload, including PR runs: the NPU test job below validates
        # the wheel this run just built. Short retention bounds artifact
        # storage; publishing to OBS stays nightly-only (see publish-obs).
        uses: actions/upload-artifact@v7
        with:
          name: wheels-ascend-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          retention-days: 7
          if-no-files-found: error

  test-wheel-ascend:
    name: Test Ascend wheel on NPU (${{ matrix.backend.name }}, CANN ${{ matrix.cann.tag }})
    # Runs for every build, including PRs: the wheel under test is the one
    # this run built. The owner check keeps fork PRs off the self-hosted NPU
    # runners (their build job is skipped anyway); draft PRs are skipped via
    # the build job's own gate.
    if: github.repository_owner == 'tile-ai'
    needs: [build-wheel-ascend]
    runs-on: linux-amd64-a5-2
    # Test the wheel against both CANN 9.2.0 and 9.2.1 toolkits so a wheel
    # validated on one version is not assumed to work on the other.
    container:
      image: ${{ matrix.cann.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cann:
          - tag: "9.2.0"
            image: "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/tilelang/tilelang-ascend:cann9.2.0-ubuntu22.04-py3.12"
          - tag: "9.2.1"
            image: "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/tilelang/tilelang-ascend:cann9.2.1-ubuntu22.04-py3.12"
        # PTO is not exercised by this workflow (its leg was removed); the
        # AscendC leg excludes pto-marked tests, mirroring ci.yml's AscendC
        # leg, so the installed wheel is validated against the AscendC suites.
        backend:
          - name: AscendC
            target: ascend
            unit_markers: not pto
    env:
      PIP_USER: "0"
      # Always exercise real kernel compilation: a warm kernel cache on a
      # persistent self-hosted runner must not mask a broken wheel.
      TILELANG_DISABLE_CACHE: "1"
      # CANN device/process logs, the main window into NPU-side failures that
      # pytest output cannot show. Job-level so every step and every xdist
      # worker inherits it; uploaded as an artifact when the job fails.
      # Level 1 = info, the CANN default.
      ASCEND_PROCESS_LOG_PATH: ${{ github.workspace }}/ascend-logs
      ASCEND_GLOBAL_LOG_LEVEL: "1"

    steps:
      - name: Checkout repository
        # Provides the examples/ascend and testing/ascend suites, at the same
        # commit the wheel was built from. No submodules: the suites here do
        # not compile against the source tree.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Trust the mounted workspace for git
        run: |
          # The container runs as root over the host-mounted workspace, so git
          # rejects it as "dubious ownership" (same as the Ascend job in ci.yml).
          git config --global --add safe.directory '*'

      - name: Set environment (self-hosted runner)
        shell: bash
        run: |
          # Hide sensitive data in logs for self-hosted runners
          if [[ -n "${{ secrets.SECRET_PATH_PREFIXES }}" ]]; then
            echo "::add-mask::${{ secrets.SECRET_PATH_PREFIXES }}"
            # Colon separated list of secrets to mask
            for secret in $(echo "${{ secrets.SECRET_PATH_PREFIXES }}" | tr ':' '\n'); do
              echo "::add-mask::${secret}"
            done
          fi

      - name: Set up CANN environment
        shell: bash
        run: |
          # Same environment setup as the Ascend job in ci.yml.
          for CANN_SET_ENV in \
            "${ASCEND_HOME_PATH:-}/set_env.sh" \
            "${ASCEND_TOOLKIT_HOME:-}/set_env.sh" \
            /usr/local/Ascend/ascend-toolkit/set_env.sh \
            /usr/local/Ascend/cann-*/set_env.sh; do
            if [[ -f "${CANN_SET_ENV}" ]]; then
              source "${CANN_SET_ENV}"
              break
            fi
          done
          export LD_LIBRARY_PATH="/usr/local/Ascend/lib64:/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver_libs:${LD_LIBRARY_PATH:-}"
          mkdir -p "${ASCEND_PROCESS_LOG_PATH}"
          # Persist the CANN environment for subsequent test steps.
          for ENV_NAME in PATH LD_LIBRARY_PATH PYTHONPATH BISHENG_HOME TOOLCHAIN_HOME \
            ASCEND_HOME_PATH ASCEND_TOOLKIT_HOME ASCEND_OPP_PATH ASCEND_AICPU_PATH \
            ASCEND_CUSTOM_OPP_PATH; do
            if [[ -v "${ENV_NAME}" ]]; then
              echo "${ENV_NAME}=${!ENV_NAME}" >> "${GITHUB_ENV}"
            fi
          done

      - name: Download built wheels
        # x86_64 only: the self-hosted NPU runners are amd64. The aarch64
        # wheel is verified host-side (install, import, version label and
        # abi3audit) inside its build leg.
        uses: actions/download-artifact@v8
        with:
          name: wheels-ascend-Linux-X64
          path: wheelhouse

      - name: Set up environment and install wheel
        id: wheel-install
        shell: bash
        run: |
          ls -lh wheelhouse/
          # Same environment setup as the Ascend job in ci.yml: keep the
          # runner's preinstalled Torch/Torch-NPU stack via a
          # --system-site-packages venv plus a pip constraint file, so the
          # resolver cannot substitute a mismatched build from PyPI.
          CI_BASE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          uv venv --clear --system-site-packages --python "${CI_BASE_PYTHON}" .venv
          source .venv/bin/activate
          export PIP_CONSTRAINT="${RUNNER_TEMP}/ascend-torch-constraints.txt"
          python - <<'PY'
          import os
          from importlib.metadata import version
          import torch
          import torch_npu

          assert torch.npu.is_available(), "Ascend wheel test requires an available NPU"
          with open(os.environ["PIP_CONSTRAINT"], "w") as constraints:
              for package in ("torch", "torch_npu"):
                  requirement = f"{package}=={version(package)}"
                  constraints.write(f"{requirement}\n")
                  print(requirement)
          PY

          python -m pip install --upgrade pip setuptools wheel
          # Test dependencies for the ci.yml suites (pytest, xdist, ...); the
          # constraint file keeps torch/torch_npu at the preinstalled versions.
          python -m pip install -v -r requirements-test.txt pybind11==2.12.0

          for WHEEL in wheelhouse/*.whl; do
            echo "Installing wheel: ${WHEEL}"
            echo "WHEEL_NAME=$(basename "${WHEEL}")" >> "${GITHUB_ENV}"
            # pip (not uv) honors PIP_CONSTRAINT, keeping the container's
            # preinstalled torch/torch_npu stack.
            python -m pip install -v "${WHEEL}"
          done

          # The pytest suites below must exercise the *installed wheel*, but
          # they need the checkout: namespace-package imports such as
          # `testing.ascend._ir` require the repo root on sys.path, and
          # testing/conftest.py inserts it deliberately (as does `python -m
          # pytest` via the cwd). So keep the checkout exactly as ci.yml runs
          # it and only hide the source package: with tilelang/ moved aside,
          # every repo-root sys.path entry resolves `import tilelang` to the
          # wheel in the venv's site-packages instead. (rm -rf first: the
          # workspace is persistent on self-hosted runners.)
          rm -rf tilelang.src-hidden
          mv tilelang tilelang.src-hidden

          # Guard: fail fast if the source tree would still shadow the wheel.
          python - <<'PY'
          import tilelang

          print("tilelang resolves to:", tilelang.__file__)
          assert "site-packages" in tilelang.__file__, f"source tree shadows the wheel: {tilelang.__file__}"
          assert "+ascend" in tilelang.__version__, tilelang.__version__
          PY

      - name: Run ${{ matrix.backend.name }} examples
        id: backend-examples
        if: ${{ !cancelled() && steps.wheel-install.outcome == 'success' }}
        shell: bash
        env:
          TILELANG_DEFAULT_TARGET: ${{ matrix.backend.target }}
          TILELANG_EXECUTION_BACKEND: auto
        run: |
          source .venv/bin/activate
          python -m pytest --verbose --durations=0 --maxfail=3 -n 4 examples/ascend

      - name: Run ${{ matrix.backend.name }} unit tests
        id: backend-unit-tests
        if: ${{ !cancelled() && steps.wheel-install.outcome == 'success' }}
        shell: bash
        env:
          TEST_MARKERS: ${{ matrix.backend.unit_markers }}
        run: |
          source .venv/bin/activate
          # Temporary: the scope-isolation cases below fail against the current
          # LegalizePTOVMIMemoryAccess (assertion facts leak across scopes).
          # The "[after-" prefix covers all after-<scope> parametrizations.
          # Remove these deselects once the pass is fixed upstream.
          # The autotune set-inputs file is ignored: it drives cross-device
          # (multi-NPU) copies that can fail or hang the job depending on the
          # runner's card topology; ci.yml still runs it against source builds.
          python -m pytest --verbose --durations=0 --maxfail=3 -n 32 -m "${TEST_MARKERS}" \
            --deselect "testing/ascend/transform/test_ascend_pto_vmi_memory_access.py::test_wrapping_condition_keeps_branch_assertions_scoped[else]" \
            --deselect "testing/ascend/transform/test_ascend_pto_vmi_memory_access.py::test_wrapping_condition_keeps_branch_assertions_scoped[after]" \
            --deselect "testing/ascend/transform/test_ascend_pto_vmi_memory_access.py::test_body_assertions_stay_in_their_statement_scope[after-" \
            --ignore testing/ascend/autotune/test_tilelang_ascend_autotune_set_inputs.py \
            testing/ascend

      - name: Summarize ${{ matrix.backend.name }} results
        if: ${{ always() }}
        shell: bash
        env:
          BACKEND_NAME: ${{ matrix.backend.name }}
          CANN_TAG: ${{ matrix.cann.tag }}
          INSTALL_RESULT: ${{ steps.wheel-install.outcome }}
          EXAMPLES_RESULT: ${{ steps.backend-examples.outcome }}
          UNIT_RESULT: ${{ steps.backend-unit-tests.outcome }}
        run: |
          {
            echo "### Ascend wheel test (${BACKEND_NAME}, CANN ${CANN_TAG})"
            echo
            echo "Wheel: \`${WHEEL_NAME:-unknown}\`"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Install wheel | ${INSTALL_RESULT} |"
            echo "| ${BACKEND_NAME} examples | ${EXAMPLES_RESULT} |"
            echo "| Unit tests | ${UNIT_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Ascend logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          # Matrix legs (backend x CANN version) run concurrently, so the leg
          # coordinates keep the artifacts distinct within one run.
          name: ascend-logs-${{ matrix.backend.name }}-cann${{ matrix.cann.tag }}-${{ github.run_id }}
          path: ascend-logs/
          retention-days: 7
          # The job can fail before any device work happened (e.g. during
          # install); an empty log dir is not an error.
          if-no-files-found: ignore

  publish-obs:
    name: Publish wheels to OBS nightly repo
    # Nightly wheels go to the Ascend community OBS pypi repo, mirroring
    # triton-ascend's Publish-Wheels job. Gated on the NPU test matrix: if
    # any test leg fails, this job never starts, so a broken wheel is never
    # published.
    if: |
      github.repository_owner == 'tile-ai' &&
      github.event_name != 'pull_request'
    needs: [build-wheel-ascend, test-wheel-ascend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize publication across refs: every run uploads to the same OBS
    # directory, and the workflow-level group (per-ref) does not stop two refs
    # from publishing concurrently. Without this, run A could list the
    # directory before run B's upload and then overwrite B's index.html with a
    # stale file list, hiding B's wheel until the next publication. Builds and
    # tests stay parallel; only the upload -> ls -> index sequence queues here.
    # cancel-in-progress must stay false: never kill an in-flight publish.
    concurrency:
      group: publish-obs-ascend-triton-open-tilelang
      cancel-in-progress: false

    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v8
        with:
          # Both architectures (wheels-ascend-Linux-X64 / -ARM64) merged
          # into one wheelhouse; the OBS upload and index cover all of them.
          pattern: wheels-ascend-*
          merge-multiple: true
          path: wheelhouse

      - name: Setup obsutil and upload to OBS
        env:
          AK: ${{ secrets.NIGHTLY_OBS_AK }}
          SK: ${{ secrets.NIGHTLY_OBS_SK }}
        run: |
          # No -x: keep the expanded obsutil config command out of the trace.
          set -euo pipefail
          WHL_COUNT=$(find wheelhouse -maxdepth 1 -name '*.whl' | wc -l)
          if [ "${WHL_COUNT}" -eq 0 ]; then
            echo "No wheel artifact; skipping publish"
            exit 0
          fi
          if [ -z "${AK}" ] || [ -z "${SK}" ]; then
            echo "::error::OBS credentials are empty (NIGHTLY_OBS_AK / NIGHTLY_OBS_SK)."
            exit 1
          fi
          curl -fL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz" -o obsutil.tar.gz
          gzip -t obsutil.tar.gz || { echo "obsutil.tar.gz is not a valid gzip"; exit 1; }
          tar xzf obsutil.tar.gz
          rm -f obsutil.tar.gz
          mv obsutil_linux_* obsutil

          obsutil/obsutil config -i="${AK}" -k="${SK}" -e=https://obs.cn-north-4.myhuaweicloud.com
          OBS_DIR="obs://ascend-triton-open/TileLang/"
          # -u: skip files already present unchanged, so a same-day rerun does
          # not rewrite identical wheels. Older dailies stay downloadable
          # until the bucket's lifecycle policy removes them.
          obsutil/obsutil cp -u wheelhouse/*.whl "${OBS_DIR}"

          # Regenerate index.html from every .whl currently in the directory
          # (non-recursive, short format), keeping only the basenames.
          obsutil/obsutil ls "${OBS_DIR}" -d -s -limit=0 \
            | grep -oE '[^/]+\.whl$' \
            | sort -u > files.txt
          while IFS= read -r f; do
            printf "<a href='%s'>%s</a><br />\n" "$f" "$f"
          done < files.txt > index.html
          obsutil/obsutil cp index.html "${OBS_DIR}"
          echo "Published ${WHL_COUNT} wheel(s); index lists $(wc -l < files.txt) file(s)."

      - name: Summary
        run: |
          {
            echo "### Ascend nightly wheels published to OBS"
            echo
            echo 'Directory: `obs://ascend-triton-open/TileLang/`'
            echo
            ls -1 wheelhouse/*.whl | sed 's|^|- |'
          } >> "${GITHUB_STEP_SUMMARY}"
