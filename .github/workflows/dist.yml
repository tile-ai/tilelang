name: Dist
on:
  workflow_dispatch:
  schedule:
    # gemini said this is 6:00 china time
    - cron: "0 22 * * *"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - setup.py
      - setup.cfg
      - pyproject.toml
      - MANIFEST.in
      - CMakeLists.txt
      - cmake/**
      - VERSION
      - version_provider.py
      - .github/workflows/dist.yml
      - .github/scripts/**
      # Exercised by the GPU wheel-test job below.
      - maint/scripts/smoke_test_wheel.py
      # Type aliases can affect package import/build behavior.
      - tilelang/_typing.py
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_HTTP_TIMEOUT: "600"
  XDG_CACHE_HOME: "${{ github.workspace }}/.cache" # to be updated
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip" # to be updated
  UV_CACHE_DIR: "${{ github.workspace }}/.cache/uv" # to be updated

jobs:
  build-sdist:
    name: Build SDist
    if: |
      github.repository_owner == 'tile-ai' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # `NO_VERSION_LABEL=ON` disables embedding the toolchain / git commit hash in version metadata.
      # Otherwise, the version of the SDist has a git hash suffix (e.g., 0.1.0+gitabcdef12),
      # but the package built from the SDist has no way to get the git hash (it is not a git repo),
      # leading to inconsistent versions between SDist and built packages (+gitabcdef12 vs. +gitunknown).
      NO_VERSION_LABEL: 'ON'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Python and uv with caching
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Build SDist
        run: |
          uv run --no-project --with=build -m -- build --sdist --outdir=dist

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: "200MB"
          create-symlink: ${{ runner.os != 'Windows' }}
          evict-old-files: "7d"
          append-timestamp: false
          key: sdist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.cc') }}
          restore-keys: |
            sdist-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.cc') }}
            sdist-${{ runner.os }}-${{ runner.arch }}
            ${{ runner.os }}-${{ runner.arch }}

      - name: Test SDist buildable
        run: |
          TEMP_DIR="$(mktemp -d -t tilelang-sdist-test)"
          cp -r dist "${TEMP_DIR}/dist"
          cd "${TEMP_DIR}"
          env -u NO_VERSION_LABEL uv pip install -v dist/*.tar.gz
          env -u NO_VERSION_LABEL python3 -c "import tilelang; print(tilelang.__version__)"

      - name: Upload SDist
        # Not PR to save artifact storage, as SDist is only needed for releases.
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]')
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheels for Python ${{ matrix.target.python_version }} on ${{ matrix.target.runner }} with ${{ matrix.target.toolkit }}
    if: |
      github.repository_owner == 'tile-ai' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      matrix:
        target:
          # Build wheels for the minimum supported Python ABI.
          - { runner: ubuntu-latest, toolkit: "CUDA-13.0", test_backends: "cu130", python_version: "3.10" }
          - { runner: ubuntu-24.04-arm, toolkit: "CUDA-13.0", test_backends: "cu130", python_version: "3.10" }
          - { runner: windows-latest, toolkit: "CUDA-13.0", test_backends: "cu130", python_version: "3.10" }
          # CUDA 13.4 and its Windows ARM64 PyTorch wheel are developer previews.
          - { runner: windows-11-arm, toolkit: "CUDA-13.4", test_backends: "cu134", torch_backend: "cu134", torch_package: "torch==2.14.0.dev20260728+cu134", torch_index_url: "https://pypi.nvidia.com/nvtorch_oot_nightly/", python_version: "3.13" }
          - { runner: macos-latest, toolkit: "Metal", python_version: "3.10" }
          # - "3.14t"  # let user to build from source for now
          # TODO: Add cp315-abi3.abi3t after PEP 803
      fail-fast: false
    timeout-minutes: 120
    runs-on: ${{ matrix.target.runner }}
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]') }}
      NO_VERSION_LABEL: "OFF"

    steps:
      - name: Enable git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Python and uv with caching
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.target.python_version }}
          activate-environment: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          # One full Windows build writes >200MB of compressed objects; a
          # smaller cap makes ccache evict entries mid-build (522 cleanups
          # observed at 200MB) so the cache never converges.
          max-size: "2GB"
          create-symlink: ${{ runner.os != 'Windows' }}
          evict-old-files: "7d"
          append-timestamp: false
          # A commit key covers source, headers, submodules and build settings.
          # Avoid hashFiles('**/*.cc'): its post-job scan also walks the freshly
          # installed multi-GB Python environments and delays cache cleanup.
          key: wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.python_version }}-${{ github.sha }}
          restore-keys: |
            wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.python_version }}
            wheel-${{ runner.os }}-${{ runner.arch }}

      - name: Install CUDA Toolkit (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && contains(matrix.target.toolkit, 'CUDA')
        shell: pwsh
        run: .\.github\scripts\install-cuda-windows-arm64.ps1

      - name: Set CIBW_BUILD
        if: runner.os != 'Windows'
        run: |
          PYTHON_VERSION="${{ matrix.target.python_version }}"
          PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
          PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" | tee -a "${GITHUB_ENV}"

          if [[ "${{ matrix.target.toolkit }}" == *"CUDA"* ]]; then
            CUDA_VERSION="${{ matrix.target.toolkit }}"
            CUDA_VERSION="${CUDA_VERSION##*-}"
            CUDA_VERSION_MAJMIN="$(echo ${CUDA_VERSION} | cut -d '.' -f-2)"
            CUDA_VERSION_MAJMIN_NODOT="${CUDA_VERSION_MAJMIN//./}"
            echo "CUDA_VERSION=${CUDA_VERSION}" | tee -a "${GITHUB_ENV}"
            echo "UV_TORCH_BACKEND=cu${CUDA_VERSION_MAJMIN_NODOT}" | tee -a "${GITHUB_ENV}"
          fi

          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            echo "NO_VERSION_LABEL=ON" | tee -a "${GITHUB_ENV}"
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            HOST_CCACHE_DIR="$(ccache --get-config cache_dir)"
            echo "CIBW_BEFORE_BUILD_LINUX=dnf install -y ccache && ccache -o cache_dir=/host${HOST_CCACHE_DIR}" | tee -a "${GITHUB_ENV}"
          fi

      - name: Set build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_BUILD_TYPE=Release" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ("${{ matrix.target.toolkit }}" -like "*CUDA*") {
            $cudaVersion = "${{ matrix.target.toolkit }}".Split('-')[-1]
            $cudaVersionMajMin = ($cudaVersion -split '\.')[0..1] -join '.'
            $cudaVersionMajMinNoDot = $cudaVersionMajMin -replace '\.', ''
            "USE_CUDA=ON" | Tee-Object -FilePath $env:GITHUB_ENV -Append
            "CUDA_VERSION=$cudaVersion" | Tee-Object -FilePath $env:GITHUB_ENV -Append
            if (-not "${{ matrix.target.torch_index_url }}") {
              "UV_TORCH_BACKEND=cu$cudaVersionMajMinNoDot" | Tee-Object -FilePath $env:GITHUB_ENV -Append
            }
          } else {
            "USE_CUDA=OFF" | Tee-Object -FilePath $env:GITHUB_ENV -Append
            "UV_TORCH_BACKEND=cpu" | Tee-Object -FilePath $env:GITHUB_ENV -Append
          }

          if ("${{ env.IS_RELEASE }}" -eq "true") {
            "NO_VERSION_LABEL=ON" | Tee-Object -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build wheels
        if: runner.os != 'Windows'
        uses: pypa/cibuildwheel@v4.3
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      # Fixed dependency paths allow ccache direct hits across runner instances.
      # cibuildwheel's random PEP 517 directories forced 700/703 warm hits through
      # preprocessing and also installed/tested the same cp310 wheel twice.
      - name: Build wheels (Windows)
        id: windows_wheel
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CCACHE_STATSLOG: ${{ runner.temp }}/tilelang-wheel-ccache.log
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "started=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT
          $python = (Resolve-Path .venv/Scripts/python.exe).Path
          uv pip install --python $python build tomli "cmake>=3.26.1" "ninja>=1.11"
          $requirements = & $python -c "import tomli; print('\n'.join(tomli.load(open('pyproject.toml', 'rb'))['build-system']['requires']))"
          uv pip install --python $python @requirements
          $extra = @(& $python -c "from build import ProjectBuilder; print('\n'.join(ProjectBuilder('.').get_requires_for_build('wheel')))") | Where-Object { $_ -ne '' }
          if ($extra.Count) {
            uv pip install --python $python @extra
          }
          uv build --wheel --no-build-isolation --python $python --out-dir raw-wheelhouse `
            -C cmake.build-type=Release -C "cmake.define.Python3_EXECUTABLE=$python"
          Get-ChildItem raw-wheelhouse -Filter *.whl | ForEach-Object {
            uvx delvewheel repair -w wheelhouse $_.FullName
          }

      - name: Windows wheel build summary
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.windows_wheel.outcome }}
          BUILD_STARTED: ${{ steps.windows_wheel.outputs.started }}
          CCACHE_STATSLOG: ${{ runner.temp }}/tilelang-wheel-ccache.log
        run: |
          $summary = @('## Windows wheel build', '', "Build step: **$env:BUILD_OUTCOME**")
          if ($env:BUILD_STARTED) {
            $elapsed = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:BUILD_STARTED
            $summary += "Elapsed: **$elapsed seconds** (dependencies, build and wheel repair)."
          }
          $summary += @('', '### Compiler cache', '')
          if (Test-Path $env:CCACHE_STATSLOG) {
            $summary += @('```text') + @(ccache --version | Select-Object -First 1)
            $summary += @(ccache --show-log-stats --verbose) + @('```')
            $source = ''
            $misses = @(Get-Content $env:CCACHE_STATSLOG | ForEach-Object {
              if ($_.StartsWith('# ')) {
                $source = $_.Substring(2)
              } elseif ($_ -eq 'cache_miss') {
                $source
              }
            })
            if ($misses.Count) {
              $summary += @('', "### Cache misses ($($misses.Count))", '', '```text')
              $summary += $misses + @('```')
            }
          } else {
            $summary += 'No per-build ccache log was produced; compilation may not have started.'
          }
          $summary += @('', '### Repaired wheels', '')
          $wheels = @(Get-ChildItem wheelhouse -Filter *.whl -ErrorAction SilentlyContinue)
          if ($wheels.Count) {
            $summary += @('| Wheel | Size (MiB) |', '| --- | ---: |')
            foreach ($wheel in $wheels) {
              $summary += ('| {0} | {1:F2} |' -f $wheel.Name, ($wheel.Length / 1MB))
            }
          } else {
            $summary += 'No repaired wheels were produced.'
          }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Test built wheels
        if: runner.os != 'Windows'
        run: |
          for WHEEL in wheelhouse/*.whl; do
            echo "Testing wheel: ${WHEEL}"
            if [[ "${WHEEL}" == *"abi3"* ]]; then
              uvx abi3audit --verbose --strict "${WHEEL}"
            fi
            (
              set -e
              uv venv test-venv
              source test-venv/bin/activate

              uv pip install -v "${WHEEL}"
              (
                set -e
                cd /
                uv run --no-project -- python -c "import tilelang; print(tilelang.__version__)"
              )
              deactivate
              rm -rf test-venv
            )
          done

      - name: Test built wheels (Windows)
        if: runner.os == 'Windows' && !matrix.target.torch_package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem wheelhouse -Filter *.whl | ForEach-Object {
            $wheel = $_.FullName
            Write-Host "Testing wheel: $wheel"
            if ($_.Name -like "*abi3*") {
              uvx abi3audit --verbose --strict $wheel
            }
            if (Test-Path test-venv) {
              Remove-Item -Recurse -Force test-venv
            }
            uv venv test-venv
            $python = Join-Path (Resolve-Path test-venv).Path "Scripts\python.exe"

            uv pip install -v --python $python $wheel
            Push-Location $env:RUNNER_TEMP
            try {
              & $python -c "import tilelang; print(tilelang.__version__)"
            } finally {
              Pop-Location
            }
            Remove-Item -Recurse -Force test-venv
          }

      - name: Test built wheels with different CUDA
        if: contains(matrix.target.toolkit, 'CUDA') && runner.os != 'Windows'
        run: |
          export UV_PYTHON=3.12
          VERSION_LOG=$(mktemp)
          for UV_TORCH_BACKEND in ${{ matrix.target.test_backends }}; do
            export UV_TORCH_BACKEND
            for WHEEL in wheelhouse/*.whl; do
              echo "Testing wheel: ${WHEEL}"
              (
                set -e
                uv venv test-venv
                source test-venv/bin/activate

                uv pip install -v "${WHEEL}"
                (
                  set -e
                  cd /
                  uv run --no-project -- python -c "import tilelang, torch; print(tilelang.__version__, torch.__version__)" >> "$VERSION_LOG"
                )
                deactivate
                rm -rf test-venv
              )
            done
          done
          cat "$VERSION_LOG"

      - name: Test built wheels with CUDA (Windows)
        if: contains(matrix.target.toolkit, 'CUDA') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $torchPackage = "${{ matrix.target.torch_package }}"
          $torchIndex = "${{ matrix.target.torch_index_url }}"
          if ($torchPackage) {
            $env:UV_PYTHON = "${{ matrix.target.python_version }}"
            $backends = @("${{ matrix.target.torch_backend }}")
          } else {
            $env:UV_PYTHON = "3.12"
            $backends = "${{ matrix.target.test_backends }}" -split '\s+'
          }
          $versionLog = Join-Path $env:RUNNER_TEMP "tilelang-wheel-versions.txt"
          if (Test-Path $versionLog) {
            Remove-Item -Force $versionLog
          }

          foreach ($backend in $backends) {
            if ($backend -eq "") {
              continue
            }
            if (-not $torchPackage) {
              $env:UV_TORCH_BACKEND = $backend
            }
            Get-ChildItem wheelhouse -Filter *.whl | ForEach-Object {
              $wheel = $_.FullName
              Write-Host "Testing wheel: $wheel"
              if ($_.Name -like "*abi3*") {
                uvx abi3audit --verbose --strict $wheel
              }
              if (Test-Path test-venv) {
                Remove-Item -Recurse -Force test-venv
              }
              uv venv test-venv
              $python = Join-Path (Resolve-Path test-venv).Path "Scripts\python.exe"

              if ($torchPackage) {
                uv pip install -v --python $python $torchPackage --index $torchIndex
              }
              uv pip install -v --python $python $wheel
              Push-Location $env:RUNNER_TEMP
              try {
                if ($torchPackage) {
                  & $python -c "import torch; assert torch.version.cuda == '13.4', torch.version.cuda"
                }
                & $python -c "import tilelang, torch; print(tilelang.__version__, torch.__version__)" | Out-File -Append -FilePath $versionLog -Encoding utf8
              } finally {
                Pop-Location
              }
              Remove-Item -Recurse -Force test-venv
            }
          }
          Get-Content $versionLog

      - name: Upload wheels
        # Not PR to save artifact storage, as wheels are only needed for releases.
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.python_version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test-wheels-gpu:
    name: Test built wheels with ${{ matrix.target.toolkit }} (on ${{ matrix.target.name }})
    # The build runners have no GPU, so nothing above proves the built wheels
    # actually launch kernels: the Linux wheels are fat CUDA+ROCm builds and
    # neither half was ever executed. This job installs the built wheel on
    # self-hosted GPU runners and runs a real kernel on each backend. Wheel
    # artifacts are only uploaded outside PRs (or for [Release] PRs), so gate
    # this job the same way as the "Upload wheels" step. It is deliberately
    # not in the needs-chain of publish-pypi: an offline self-hosted runner
    # must not be able to block a release.
    if: |
      github.repository_owner == 'tile-ai' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]'))
    needs: [build-wheels]
    strategy:
      matrix:
        target:
          # Both consume the Linux x86_64 wheel built by the CUDA-13.0 leg above.
          - { tags: [self-hosted, nvidia], name: self-hosted-nvidia, toolkit: CUDA-13.0, python_version: "3.12" }
          - { tags: [self-hosted, amd, gfx942], name: self-hosted-amd-gfx942, toolkit: ROCm-7.2, python_version: "3.12" }
      fail-fast: false
    timeout-minutes: 60
    runs-on: ${{ matrix.target.tags }}

    steps:
      - name: Checkout repository
        # Only needed for maint/scripts/smoke_test_wheel.py; the wheel under
        # test comes from the build-wheels artifact.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set environment (self-hosted runners)
        run: |
          # Hide sensitive data in logs for self-hosted runners
          if [[ -n "${{ secrets.SECRET_PATH_PREFIXES }}" ]]; then
            echo "::add-mask::${{ secrets.SECRET_PATH_PREFIXES }}"
            # Colon separated list of secrets to mask
            for secret in $(echo "${{ secrets.SECRET_PATH_PREFIXES }}" | tr ':' '\n'); do
              echo "::add-mask::${secret}"
            done
          fi

      - name: Set environment (CUDA)
        if: contains(matrix.target.toolkit, 'CUDA')
        run: |
          TOOLKIT="${{ matrix.target.toolkit }}"
          CUDA_VERSION="${TOOLKIT##*-}"
          CUDA_VERSION_MAJMIN="$(echo "${CUDA_VERSION}" | cut -d '.' -f-2)"
          CUDA_VERSION_MAJMIN_NODOT="${CUDA_VERSION_MAJMIN//./}"
          if [[ "${TOOLKIT}" == "Nightly-"* ]]; then
            # Use torch nightly builds
            TORCH_INDEX_URL="https://download.pytorch.org/whl/nightly/cu${CUDA_VERSION_MAJMIN_NODOT}"
          else
            TORCH_INDEX_URL="https://download.pytorch.org/whl/cu${CUDA_VERSION_MAJMIN_NODOT}"
          fi
          echo "TORCH_INDEX_URL=${TORCH_INDEX_URL}" | tee -a "${GITHUB_ENV}"

          # The wheel JIT-compiles kernels with the host nvcc at runtime.
          if [[ -x "$(command -v nvcc)" ]]; then
            echo "\$ $(command -v nvcc) --version" && nvcc --version
            NVCC_VERSION="$(nvcc --version | sed -n 's/.*release \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n1)"
            if [[ -n "${NVCC_VERSION}" && "${NVCC_VERSION%%.*}" != "${CUDA_VERSION%%.*}" ]]; then
              echo "::warning::nvcc CUDA ${NVCC_VERSION} does not match requested ${TOOLKIT}."
            fi
          else
            echo "::warning::nvcc not found in PATH!"
          fi

      - name: Set environment (ROCm)
        if: contains(matrix.target.toolkit, 'ROCm')
        run: |
          TOOLKIT="${{ matrix.target.toolkit }}"
          ROCM_VERSION="${TOOLKIT##*-}"
          ROCM_VERSION_MAJMIN="$(echo "${ROCM_VERSION}" | cut -d '.' -f-2)"
          if [[ "${TOOLKIT}" == "Nightly-"* ]]; then
            # Use torch nightly builds
            TORCH_INDEX_URL="https://download.pytorch.org/whl/nightly/rocm${ROCM_VERSION_MAJMIN}"
          else
            TORCH_INDEX_URL="https://download.pytorch.org/whl/rocm${ROCM_VERSION_MAJMIN}"
          fi
          echo "TORCH_INDEX_URL=${TORCH_INDEX_URL}" | tee -a "${GITHUB_ENV}"

          if [[ ! -x "$(command -v hipcc)" ]]; then
            export PATH="/opt/rocm/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/rocm/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
            echo "PATH=${PATH}" | tee -a "${GITHUB_ENV}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" | tee -a "${GITHUB_ENV}"
          fi
          if [[ -x "$(command -v hipcc)" ]]; then
            echo "\$ $(command -v hipcc) --version" && hipcc --version
          else
            echo "::warning::hipcc not found in PATH!"
          fi

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.target.python_version }}
          activate-environment: true
          # Do not use cache upload/download for self-hosted runners, as it is
          # slow; the local cache directory persists on the runner instead.
          enable-cache: false
          prune-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          ignore-nothing-to-cache: true

      - name: Download built wheels
        uses: actions/download-artifact@v8
        with:
          # Matches the wheels built for this runner's os/arch (Linux-X64).
          pattern: wheels-*-${{ runner.os }}-${{ runner.arch }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Test built wheels on GPU
        run: |
          # Always exercise real kernel compilation: a warm kernel cache on a
          # persistent self-hosted runner must not mask a broken wheel.
          export TILELANG_DISABLE_CACHE=1

          ls -lh wheelhouse/
          for WHEEL in wheelhouse/*.whl; do
            echo "Testing wheel: ${WHEEL}"
            (
              set -e
              uv venv test-venv
              source test-venv/bin/activate

              # Install torch from the toolkit-matched channel only, before the
              # wheel, so the resolver cannot substitute a mismatched build
              # from PyPI (e.g. the CUDA torch on a ROCm host).
              uv pip install -v --index-url "${TORCH_INDEX_URL}" torch
              uv pip install -v "${WHEEL}"
              # Run from RUNNER_TEMP so `import tilelang` resolves to the
              # installed wheel rather than the repository source tree.
              cp maint/scripts/smoke_test_wheel.py "${RUNNER_TEMP}/"
              (
                set -e
                cd "${RUNNER_TEMP}"
                uv run --no-project -- python smoke_test_wheel.py
              )
              deactivate
              rm -rf test-venv
            )
          done

  test-wheels-ascend:
    name: Test built wheels on Ascend NPU (CANN ${{ matrix.cann }}, Python ${{ matrix.python }})
    # The Linux wheel's Ascend half is never executed before release; this
    # job installs the built wheel on the self-hosted Ascend runner (same
    # CANN container as the Ascend CI job) and runs the AscendC suites
    # against it. Like test-wheels-gpu, it does not gate publish-pypi.
    if: |
      github.repository_owner == 'tile-ai' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]'))
    needs: [build-wheels]
    runs-on: linux-amd64-a5-4
    strategy:
      fail-fast: false
      matrix:
        cann:
          - "9.3.0-weekly.20261112"
        python:
          - "3.13"
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/tilelang/tilelang-ascend:cann${{ matrix.cann }}-ubuntu22.04-py${{ matrix.python }}
    timeout-minutes: 120
    env:
      PIP_USER: "0"

    steps:
      - name: Checkout repository
        # Test suites only; no submodules: the tests run against the
        # installed wheel, not the source tree.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Trust the mounted workspace for git
        run: |
          # The container runs as root over the host-mounted workspace, so git
          # rejects it as "dubious ownership"; CMake's submodule check needs it.
          git config --global --add safe.directory '*'

      - name: Download built wheels
        # The Linux x86_64 fat wheel (CUDA+ROCm+Ascend) built by the
        # CUDA-13.0 leg; the self-hosted NPU runners are amd64.
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*-${{ runner.os }}-${{ runner.arch }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Set up environment and install Ascend wheel
        id: wheel-install
        shell: bash
        run: |
          # Same environment setup as the Ascend job in ci.yml. Each matrix
          # leg runs in the CANN container for its own Python version, so
          # `python` below is that version.
          for CANN_SET_ENV in \
            "${ASCEND_HOME_PATH:-}/set_env.sh" \
            "${ASCEND_TOOLKIT_HOME:-}/set_env.sh" \
            /usr/local/Ascend/ascend-toolkit/set_env.sh \
            /usr/local/Ascend/cann-*/set_env.sh; do
            if [[ -f "${CANN_SET_ENV}" ]]; then
              source "${CANN_SET_ENV}"
              break
            fi
          done
          export LD_LIBRARY_PATH="/usr/local/Ascend/lib64:/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver_libs:${LD_LIBRARY_PATH:-}"
          # Persist the CANN environment for subsequent test steps.
          for ENV_NAME in PATH LD_LIBRARY_PATH PYTHONPATH BISHENG_HOME TOOLCHAIN_HOME \
            ASCEND_HOME_PATH ASCEND_TOOLKIT_HOME ASCEND_OPP_PATH ASCEND_AICPU_PATH \
            ASCEND_CUSTOM_OPP_PATH; do
            if [[ -v "${ENV_NAME}" ]]; then
              echo "${ENV_NAME}=${!ENV_NAME}" >> "${GITHUB_ENV}"
            fi
          done

          # Keep the runner's preinstalled Torch/Torch-NPU stack.
          CI_BASE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          uv venv --clear --system-site-packages --python "${CI_BASE_PYTHON}" .venv
          source .venv/bin/activate
          export PIP_CONSTRAINT="${RUNNER_TEMP}/ascend-torch-constraints.txt"
          python - <<'PY'
          import os
          from importlib.metadata import version
          import torch
          import torch_npu

          assert torch.npu.is_available(), "Ascend CI requires an available NPU"
          with open(os.environ["PIP_CONSTRAINT"], "w") as constraints:
              for package in ("torch", "torch_npu"):
                  requirement = f"{package}=={version(package)}"
                  constraints.write(f"{requirement}\n")
                  print(requirement)
          PY

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -v -r requirements-test.txt pybind11==2.12.0

          # Install the wheel for this Ascend environment: the Linux x86_64
          # fat wheel is a single abi3 artifact (pyproject: wheel.py-api =
          # "cp39"), so it installs into every Python version of the matrix.
          ls -lh wheelhouse/
          WHEEL="$(ls wheelhouse/*.whl 2>/dev/null | head -n 1 || true)"
          if [[ -z "${WHEEL}" ]]; then
            echo "::error::no wheel artifact found in wheelhouse/"
            exit 1
          fi
          echo "Installing wheel: ${WHEEL}"
          echo "WHEEL_NAME=$(basename "${WHEEL}")" >> "${GITHUB_ENV}"
          # pip (not uv) honors PIP_CONSTRAINT, keeping the container's
          # preinstalled torch/torch_npu stack.
          python -m pip install -v "${WHEEL}"

          # The pytest suites below must exercise the *installed wheel*, but
          # they need the checkout: testing/conftest.py inserts the repo root
          # on sys.path deliberately. With tilelang/ moved aside, every
          # repo-root sys.path entry resolves `import tilelang` to the wheel
          # in the venv's site-packages instead. (rm -rf first: the workspace
          # is persistent on self-hosted runners.)
          rm -rf tilelang.src-hidden
          mv tilelang tilelang.src-hidden

          # Guard: fail fast if the source tree would still shadow the wheel.
          python - <<'PY'
          import tilelang

          print("tilelang resolves to:", tilelang.__file__)
          assert "site-packages" in tilelang.__file__, f"source tree shadows the wheel: {tilelang.__file__}"
          PY

      - name: Run AscendC examples
        id: backend-examples
        if: ${{ !cancelled() && steps.wheel-install.outcome == 'success' }}
        shell: bash
        env:
          TILELANG_DEFAULT_TARGET: ascend
          TILELANG_EXECUTION_BACKEND: auto
        run: |
          source .venv/bin/activate
          python -m pytest --verbose --durations=0 --maxfail=3 -n 4 examples/ascend

      - name: Run AscendC unit tests
        id: backend-unit-tests
        if: ${{ !cancelled() && steps.wheel-install.outcome == 'success' }}
        shell: bash
        env:
          TEST_MARKERS: not pto
        run: |
          source .venv/bin/activate
          # test_ascend_vmi_alloc_marker.py builds a CUDA Target at module
          # import time, which aborts collection on the CUDA-less NPU
          # container; all its tests are pto-marked and excluded anyway.
          python -m pytest --verbose --durations=0 --maxfail=3 -n 32 -m "${TEST_MARKERS}" \
            --ignore testing/ascend/transform/test_ascend_vmi_alloc_marker.py \
            testing/ascend

      - name: Summarize Ascend wheel test results
        if: ${{ always() }}
        shell: bash
        env:
          WHEEL_NAME: ${{ env.WHEEL_NAME }}
          CANN_VERSION: ${{ matrix.cann }}
          PYTHON_VERSION: ${{ matrix.python }}
          INSTALL_RESULT: ${{ steps.wheel-install.outcome }}
          EXAMPLES_RESULT: ${{ steps.backend-examples.outcome }}
          UNIT_RESULT: ${{ steps.backend-unit-tests.outcome }}
        run: |
          {
            echo "### Test built wheels on Ascend NPU (CANN ${CANN_VERSION}, Python ${PYTHON_VERSION})"
            echo
            echo "Wheel: \`${WHEEL_NAME:-unknown}\`"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Install wheel | ${INSTALL_RESULT} |"
            echo "| AscendC examples | ${EXAMPLES_RESULT} |"
            echo "| AscendC unit tests | ${UNIT_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  list-artifacts:
    name: List artifacts
    # Not PR to save artifact storage, as artifacts are only needed for releases.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.title, '[Release]')
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    timeout-minutes: 15
    steps:
      - name: Download built SDist
        uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          name: sdist
          path: dist

      - name: Download built wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [list-artifacts]
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tilelang
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release tag matches VERSION
        run: |
          VERSION="$(cat VERSION)"
          TAG="${GITHUB_REF_NAME}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Release tag ${TAG} does not match VERSION v${VERSION}"
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: dist

      - name: List distributions
        run: ls -lh dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
