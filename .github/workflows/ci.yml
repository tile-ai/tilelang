name: CI
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Allow to trigger the workflow manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLANG_TIDY_CMAKE_OPTIONS: "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON" # to be updated
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "" # explicit cleanup
  PIP_USER: "0" # install into the job venv
  PIP_TIMEOUT: "600"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_HTTP_TIMEOUT: "600"
  XDG_CACHE_HOME: "${{ github.workspace }}/.cache" # to be updated
  PIP_CACHE_DIR: "${{ github.workspace }}/.cache/pip" # to be updated
  UV_CACHE_DIR: "${{ github.workspace }}/.cache/uv" # to be updated
  PRE_COMMIT_HOME: "${{ github.workspace }}/.cache/pip/.pre-commit" # to be updated

jobs:
  lint:
    name: Quick Lint
    runs-on: [self-hosted, ascend]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python 3.12
        id: setup-pylowest
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          update-environment: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
            .pre-commit-config.yaml

      - name: Install pipx
        run: |
          # Install local copies without uninstalling the runner's shared packages.
          "${{ steps.setup-pylowest.outputs.python-path }}" -m pip install --ignore-installed pipx

      - name: Check AST with Python 3.12
        run: |
          "${{ steps.setup-pylowest.outputs.python-path }}" -m compileall -q -f tilelang

      - name: C++ API Style Audit (warning only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          "${{ steps.setup-pylowest.outputs.python-path }}" maint/scripts/audit_cpp_api_style.py --github-warnings --limit 20

      - name: Pre-commit Lint
        run: |
          if ! pipx run pre-commit run --all-files --color=always --show-diff-on-failure; then
            echo "::error::Pre-commit checks failed. Please run 'pre-commit install' and 'pre-commit run --all-files' locally to see the issues."
            exit 1
          fi

  tests:
    name: Test for Python ${{ matrix.python-version }} with ${{ matrix.runner.toolkit }} (on ${{ matrix.runner.name }})
    if: |
      github.repository_owner == 'deepseek-ai' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [lint]
    runs-on: ${{ matrix.runner.tags }}
    strategy:
      matrix:
        runner:
          - tags: [self-hosted, ascend]
            name: self-hosted-ascend
            toolkit: Ascend
        python-version:
          - "3.12"
      fail-fast: false
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set environment (self-hosted runners)
        if: startsWith(matrix.runner.name, 'self-hosted')
        run: |
          # Hide sensitive data in logs for self-hosted runners
          if [[ -n "${{ secrets.SECRET_PATH_PREFIXES }}" ]]; then
            echo "::add-mask::${{ secrets.SECRET_PATH_PREFIXES }}"
            # Colon separated list of secrets to mask
            for secret in $(echo "${{ secrets.SECRET_PATH_PREFIXES }}" | tr ':' '\n'); do
              echo "::add-mask::${secret}"
            done
          fi

          # Preserve the runner interpreter before setup-uv changes PATH.
          CI_BASE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          CI_PYTHON_VERSION="$("${CI_BASE_PYTHON}" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [[ "${CI_PYTHON_VERSION}" != "${{ matrix.python-version }}" ]]; then
            echo "::error::Runner Python ${CI_PYTHON_VERSION} does not match requested ${{ matrix.python-version }}"
            exit 1
          fi
          echo "CI_BASE_PYTHON=${CI_BASE_PYTHON}" >> "${GITHUB_ENV}"

          # Use runner tool_cache as cache root for self-hosted runners to avoid internet connection
          # issues and to share cache between jobs.
          export XDG_CACHE_HOME="${{ runner.tool_cache }}/.ci-cache-${{ github.workflow }}"
          echo "XDG_CACHE_HOME=${XDG_CACHE_HOME}" | tee -a "${GITHUB_ENV}"
          echo "PIP_CACHE_DIR=${XDG_CACHE_HOME}/pip" | tee -a "${GITHUB_ENV}"
          echo "UV_CACHE_DIR=${XDG_CACHE_HOME}/uv" | tee -a "${GITHUB_ENV}"
          echo "PRE_COMMIT_HOME=${XDG_CACHE_HOME}/pip/.pre-commit" | tee -a "${GITHUB_ENV}"

          # PTO toolchain is provided by the self-contained `ptoas` wheel installed
          # in the "Setup venv" step (auditwheel-repaired: bundles the LLVM/MLIR
          # shared libs with $ORIGIN RPATH, ptodsl, mlir dialects, and the ptoas CLI
          # console script). No PYTHONPATH / PATH / LD_LIBRARY_PATH wiring to a build
          # tree is needed anymore.

          # CANN runtime env for torch_npu autoload (libascendcl.so, liburma.so.0, ...).
          # The runner daemon does not inherit the container-injected CANN environment,
          # so torch_npu fails to load at `import torch` without this.
          CANN_SET_ENV="$(ls -d /usr/local/Ascend/cann-*/set_env.sh 2>/dev/null | sort | tail -1)"
          if [[ -n "${CANN_SET_ENV}" ]]; then
            # shellcheck disable=SC1090
            source "${CANN_SET_ENV}"
          fi
          # driver / urma library paths injected by the container but absent from set_env.sh
          export LD_LIBRARY_PATH="/usr/local/Ascend/lib64:/usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:/usr/local/Ascend/driver_libs:${LD_LIBRARY_PATH}"

          # Propagate the assembled CANN environment to subsequent steps.
          # (PTO/LLVM libs are self-contained inside the installed `ptoas` wheel.)
          {
            echo "ASCEND_TOOLKIT_HOME=${ASCEND_TOOLKIT_HOME}"
            echo "ASCEND_HOME_PATH=${ASCEND_HOME_PATH}"
            echo "ASCEND_OPP_PATH=${ASCEND_OPP_PATH}"
            echo "ASCEND_AICPU_PATH=${ASCEND_AICPU_PATH}"
            echo "TOOLCHAIN_HOME=${TOOLCHAIN_HOME}"
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
          } | tee -a "${GITHUB_ENV}"

      - name: Setup uv with caching
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: false
          # Do not use cache for self-hosted runners, as it will download/upload caches which is slow.
          enable-cache: ${{ !startsWith(matrix.runner.name, 'self-hosted') }}
          prune-cache: ${{ !startsWith(matrix.runner.name, 'self-hosted') }}
          # Use runner tool_cache for self-hosted runners
          cache-local-path: ${{ env.UV_CACHE_DIR }}
          ignore-nothing-to-cache: true
          # Extra cache key to upload/download caches on GitHub-hosted runners
          cache-suffix: uv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ matrix.runner.name }}-${{ matrix.runner.toolkit }}
          cache-dependency-glob: |
            pyproject.toml
            requirements*.txt
            .pre-commit-config.yaml

      - name: Setup venv
        id: setup-venv
        run: |
          set -o pipefail

          export PYTHONPATH=""
          export PIP_USER=0

          uv venv --clear --system-site-packages --python "${CI_BASE_PYTHON}" .venv
          source .venv/bin/activate
          export UV_PYTHON="${VIRTUAL_ENV}/bin/python"
          export PIP_CONSTRAINT="${RUNNER_TEMP}/inherited-torch-constraints.txt"
          {
            echo "VIRTUAL_ENV=${VIRTUAL_ENV}"
            echo "UV_PYTHON=${UV_PYTHON}"
            echo "PIP_CONSTRAINT=${PIP_CONSTRAINT}"
          } >> "${GITHUB_ENV}"
          echo "${VIRTUAL_ENV}/bin" >> "${GITHUB_PATH}"

          # Fail early if the runner's Torch stack cannot load, and preserve its versions.
          python - <<'PY'
          import importlib
          import os
          from importlib.metadata import version

          with open(os.environ["PIP_CONSTRAINT"], "w") as constraints:
              for package in ("torch", "torch_npu"):
                  module = importlib.import_module(package)
                  requirement = f"{package}=={version(package)}"
                  constraints.write(f"{requirement}\n")
                  print(f"{requirement} ({module.__file__})")
          PY

          # pip recognizes inherited packages; uv pip would install another Torch copy.
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -v -r requirements-test.txt
          python -m pip install pybind11==2.12.0
          echo "::group::torch.utils.collect_env"
          python -m torch.utils.collect_env
          # Self-contained PTO toolchain from the official hw-native-sys/PTOAS
          # vmi-v0.1.6 release (ptodsl + MLIR dialects + ptoas CLI).
          case "${RUNNER_ARCH}" in
            ARM64)
              PTOAS_ARCH=aarch64
              PTOAS_SHA256=4fa6ccd152b126fbf9d2453b86d424a5212606ac4776f4dc9a50d5fb75566fd6
              ;;
            X64)
              PTOAS_ARCH=x86_64
              PTOAS_SHA256=e215fb0d4076566d4d9e41aa42ee85e93910b06d21701048129edc943903c219
              ;;
            *)
              echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          PTOAS_CACHE_DIR="${XDG_CACHE_HOME}/ptoas"
          PTOAS_FILENAME="ptoas_vmi-0.1.6-cp312-cp312-manylinux_2_34_${PTOAS_ARCH}.whl"
          PTOAS_WHEEL="${PTOAS_CACHE_DIR}/${PTOAS_FILENAME}"
          mkdir -p "${PTOAS_CACHE_DIR}"
          if ! [[ -f "${PTOAS_WHEEL}" ]] || \
             ! printf '%s  %s\n' "${PTOAS_SHA256}" "${PTOAS_WHEEL}" | sha256sum --check --status -; then
            PTOAS_DOWNLOAD="$(mktemp "${PTOAS_WHEEL}.tmp.XXXXXX")"
            trap 'rm -f "${PTOAS_DOWNLOAD}"' EXIT
            curl --fail --location --retry 3 \
              --output "${PTOAS_DOWNLOAD}" \
              "https://github.com/hw-native-sys/PTOAS/releases/download/vmi-v0.1.6/${PTOAS_FILENAME}"
            printf '%s  %s\n' "${PTOAS_SHA256}" "${PTOAS_DOWNLOAD}" | sha256sum --check -
            mv "${PTOAS_DOWNLOAD}" "${PTOAS_WHEEL}"
            trap - EXIT
          fi
          python -m pip install "${PTOAS_WHEEL}"
          echo "::endgroup::"

      - name: Clear uv cache for self-hosted runners (if setup failed)
        if: >-
          ${{
            failure() &&
            startsWith(matrix.runner.name, 'self-hosted') &&
            (steps.setup-uv.conclusion == 'failure' || steps.setup-venv.conclusion == 'failure')
          }}
        run: |
          echo "Clearing uv cache at ${UV_CACHE_DIR} due to failure."
          uv cache clean

      - name: Install project (wheel form)
        env:
          USE_CUDA: "OFF"
        run: |
          python -m pip install -v .

      - name: Run Ascend example tests with Python ${{ matrix.python-version }}
        run: |
          cd testing
          PYTEST=(
            uv run --no-project -m --
            pytest --verbose --color=yes --durations=0 --showlocals --cache-clear -n 4
          )
          "${PYTEST[@]}" --maxfail=3 -m "not pto" \
            ../examples/ascend

      - name: Run Ascend unit tests with Python ${{ matrix.python-version }}
        run: |
          cd testing
          PYTEST=(
            uv run --no-project -m --
            pytest --verbose --color=yes --durations=0 --showlocals --cache-clear -n 32
          )
          "${PYTEST[@]}" --maxfail=3 -m "not pto" \
            ascend

      - name: Run PTO example tests with Python ${{ matrix.python-version }}
        run: |
          cd testing
          PYTEST=(
            uv run --no-project -m --
            pytest --verbose --color=yes --durations=0 --showlocals --cache-clear -n 4
          )
          "${PYTEST[@]}" --maxfail=3 -m "pto" \
            ../examples/ascend

      - name: Run PTO unit tests with Python ${{ matrix.python-version }}
        run: |
          cd testing
          PYTEST=(
            uv run --no-project -m --
            pytest --verbose --color=yes --durations=0 --showlocals --cache-clear -n 32
          )
          "${PYTEST[@]}" --maxfail=3 -m "pto" \
            ascend

      # Disabled on the asc branch while Ascend CI is split out from upstream multi-backend CI:
      # - CUDA examples: ../examples
      # - CUDA tests: testing/python
      # - ROCm tests: testing/python
      # - Metal tests: testing/python -k metal
      # - CuTeDSL examples job

      - name: List generated files
        if: ${{ !cancelled() }}
        run: |
          find . -type f -name '*.py[co]' -delete
          find . -depth -type d -name "__pycache__" -exec rm -r "{}" +
          if git status --ignored --porcelain | grep -qvE '/$'; then
            ls -alh $(git status --ignored --porcelain | grep -vE '/$' | grep -oE '\S+$')
          fi
