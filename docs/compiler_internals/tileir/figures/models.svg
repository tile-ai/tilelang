<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" role="img" aria-label="The two execution models" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><style>
.f-t{fill:var(--fg,#1f2328);font-size:13px}
.f-m{fill:var(--muted,#59636e)} .f-s{font-size:11.5px} .f-b{font-weight:600}
.f-c{text-anchor:middle} .f-e{text-anchor:end}
.f-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.f-panel{fill:none;stroke:var(--line,#d1d9e0)}
.f-cell{fill:var(--soft,#f6f8fa);stroke:var(--line,#d1d9e0)}
.f-blue{fill:#3b82f6;fill-opacity:.2;stroke:#3b82f6} .f-green{fill:#22a06b;fill-opacity:.2;stroke:#22a06b}
.f-orange{fill:#d97706;fill-opacity:.2;stroke:#d97706} .f-purple{fill:#8b5cf6;fill-opacity:.2;stroke:#8b5cf6}
.f-red{fill:#dc2626;fill-opacity:.15;stroke:#dc2626}
.f-off{fill:none;stroke:var(--muted,#59636e);stroke-dasharray:3 3;opacity:.6}
.f-ln{stroke:var(--muted,#59636e);fill:none;stroke-width:1.3} .f-dash{stroke-dasharray:5 4}
.f-ah{fill:var(--muted,#59636e)}
</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ah" d="M0 0L10 5L0 10z"/></marker></defs><text x="180" y="22" class="f-t f-b f-c">TileLang: one CTA, N threads</text><rect x="10" y="34" width="340" height="233" rx="8" class="f-panel"/><text x="68" y="58" class="f-t f-s f-m f-c">thread 0</text><rect x="40" y="68" width="56" height="30" rx="4" class="f-blue"/><text x="68" y="87.5" class="f-t f-c">S1</text><rect x="40" y="138" width="56" height="30" rx="4" class="f-green"/><text x="68" y="157.5" class="f-t f-c">S2</text><line x1="68" y1="168" x2="68" y2="194" class="f-ln" marker-end="url(#ah)"/><text x="138" y="58" class="f-t f-s f-m f-c">thread 1</text><rect x="110" y="68" width="56" height="30" rx="4" class="f-blue"/><text x="138" y="87.5" class="f-t f-c">S1</text><rect x="110" y="138" width="56" height="30" rx="4" class="f-green"/><text x="138" y="157.5" class="f-t f-c">S2</text><line x1="138" y1="168" x2="138" y2="194" class="f-ln" marker-end="url(#ah)"/><text x="208" y="58" class="f-t f-s f-m f-c">thread 2</text><rect x="180" y="68" width="56" height="30" rx="4" class="f-blue"/><text x="208" y="87.5" class="f-t f-c">S1</text><rect x="180" y="138" width="56" height="30" rx="4" class="f-green"/><text x="208" y="157.5" class="f-t f-c">S2</text><line x1="208" y1="168" x2="208" y2="194" class="f-ln" marker-end="url(#ah)"/><text x="290" y="58" class="f-t f-s f-m f-c">thread N−1</text><rect x="262" y="68" width="56" height="30" rx="4" class="f-blue"/><text x="290" y="87.5" class="f-t f-c">S1</text><rect x="262" y="138" width="56" height="30" rx="4" class="f-green"/><text x="290" y="157.5" class="f-t f-c">S2</text><line x1="290" y1="168" x2="290" y2="194" class="f-ln" marker-end="url(#ah)"/><text x="249" y="88" class="f-t f-c f-m">…</text><text x="249" y="158" class="f-t f-c f-m">…</text><line x1="26" y1="112" x2="334" y2="112" class="f-ln f-dash"/><text x="180" y="128" class="f-t f-s f-m f-c">barrier: synchronization between threads</text><rect x="30" y="196" width="300" height="34" rx="4" class="f-cell"/><text x="180" y="217.5" class="f-t f-s f-c">shared / fragment: mutable, read and written by index</text><text x="180" y="254" class="f-t f-s f-m f-c">scheduling: written by the user</text><line x1="356" y1="160" x2="404" y2="160" class="f-ln" marker-end="url(#ah)"/><text x="380" y="150" class="f-t f-s f-m f-c">backend</text><text x="580" y="22" class="f-t f-b f-c">cuda_tile: one tile block, sequential semantics</text><rect x="410" y="34" width="340" height="233" rx="8" class="f-panel"/><rect x="440" y="68" width="280" height="30" rx="4" class="f-blue"/><text x="580" y="87.5" class="f-t f-s f-c">S1: one tile operation over all lanes</text><line x1="470" y1="98" x2="470" y2="136" class="f-ln" marker-end="url(#ah)"/><text x="600" y="122" class="f-t f-s f-m f-c">no threads, no barriers</text><rect x="440" y="138" width="280" height="30" rx="4" class="f-green"/><text x="580" y="157.5" class="f-t f-s f-c">S2: one tile operation</text><line x1="470" y1="168" x2="470" y2="194" class="f-ln" marker-end="url(#ah)"/><rect x="440" y="196" width="280" height="34" rx="4" class="f-cell"/><text x="580" y="217.5" class="f-t f-s f-c">immutable SSA tiles; memory via pointer or view</text><text x="580" y="254" class="f-t f-s f-m f-c">scheduling: decided by tileiras</text></svg>
