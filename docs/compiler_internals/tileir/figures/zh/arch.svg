<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" role="img" aria-label="总体架构" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><style>
.f-t{fill:var(--fg,#1f2328);font-size:13px}
.f-m{fill:var(--muted,#59636e)} .f-s{font-size:11.5px} .f-b{font-weight:600}
.f-c{text-anchor:middle} .f-e{text-anchor:end}
.f-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.f-panel{fill:none;stroke:var(--line,#d1d9e0)}
.f-cell{fill:var(--soft,#f6f8fa);stroke:var(--line,#d1d9e0)}
.f-blue{fill:#3b82f6;fill-opacity:.2;stroke:#3b82f6} .f-green{fill:#22a06b;fill-opacity:.2;stroke:#22a06b}
.f-orange{fill:#d97706;fill-opacity:.2;stroke:#d97706} .f-purple{fill:#8b5cf6;fill-opacity:.2;stroke:#8b5cf6}
.f-red{fill:#dc2626;fill-opacity:.15;stroke:#dc2626}
.f-off{fill:none;stroke:var(--muted,#59636e);stroke-dasharray:3 3;opacity:.6}
.f-ln{stroke:var(--muted,#59636e);fill:none;stroke-width:1.3} .f-dash{stroke-dasharray:5 4}
.f-ah{fill:var(--muted,#59636e)}
</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ah" d="M0 0L10 5L0 10z"/></marker></defs><rect x="342" y="2" width="240" height="46" rx="6" class="f-purple"/><text x="462" y="22" class="f-t f-b f-c">分析库：Prove、lane 依赖等</text><text x="462" y="39" class="f-t f-s f-m f-c">基于 TVM arith::Analyzer、IterMap 和 Z3</text><line x1="462" y1="48" x2="462" y2="71" class="f-ln f-dash" marker-end="url(#ah)"/><rect x="10" y="72" width="160" height="48" rx="6" class="f-cell"/><text x="90" y="93" class="f-t f-b f-c">TileLang 程序</text><text x="90" y="110" class="f-t f-s f-m f-c">前端不变</text><rect x="196" y="72" width="160" height="48" rx="6" class="f-cell"/><text x="276" y="93" class="f-t f-b f-c">TIR</text><text x="276" y="110" class="f-t f-s f-m f-c">唯一的一层 IR</text><rect x="382" y="72" width="160" height="48" rx="6" class="f-blue"/><text x="462" y="93" class="f-t f-b f-c">pass pipeline（C++）</text><text x="462" y="110" class="f-t f-s f-m f-c">每个 pass 一种决策或拒绝</text><rect x="568" y="72" width="160" height="48" rx="6" class="f-green"/><text x="648" y="100.5" class="f-t f-b f-c">Tile-form TIR</text><line x1="170" y1="96" x2="195" y2="96" class="f-ln" marker-end="url(#ah)"/><line x1="356" y1="96" x2="381" y2="96" class="f-ln" marker-end="url(#ah)"/><line x1="542" y1="96" x2="567" y2="96" class="f-ln" marker-end="url(#ah)"/><line x1="648" y1="120" x2="648" y2="161" class="f-ln" marker-end="url(#ah)"/><rect x="568" y="162" width="160" height="48" rx="6" class="f-blue"/><text x="648" y="183" class="f-t f-b f-c">codegen（C++）</text><text x="648" y="200" class="f-t f-s f-m f-c">只翻译成 cuda_tile 文本</text><rect x="382" y="162" width="160" height="48" rx="6" class="f-cell"/><text x="462" y="183" class="f-t f-b f-c">工具链</text><text x="462" y="200" class="f-t f-s f-m f-c">tileiras 编译成 cubin</text><rect x="196" y="162" width="160" height="48" rx="6" class="f-cell"/><text x="276" y="183" class="f-t f-b f-c">tvm_ffi 加载与启动</text><text x="276" y="200" class="f-t f-s f-m f-c">与 CUDA 后端共用</text><line x1="568" y1="186" x2="543" y2="186" class="f-ln" marker-end="url(#ah)"/><line x1="382" y1="186" x2="357" y2="186" class="f-ln" marker-end="url(#ah)"/><text x="90" y="182" class="f-t f-s f-m f-c">Python 只有注册、pass 列表、</text><text x="90" y="199" class="f-t f-s f-m f-c">工具链调用和执行适配</text></svg>
