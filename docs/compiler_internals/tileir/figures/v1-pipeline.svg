<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" role="img" aria-label="The compilation and execution path of the first version" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><style>
.f-t{fill:var(--fg,#1f2328);font-size:13px}
.f-m{fill:var(--muted,#59636e)} .f-s{font-size:11.5px} .f-b{font-weight:600}
.f-c{text-anchor:middle} .f-e{text-anchor:end}
.f-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.f-panel{fill:none;stroke:var(--line,#d1d9e0)}
.f-cell{fill:var(--soft,#f6f8fa);stroke:var(--line,#d1d9e0)}
.f-blue{fill:#3b82f6;fill-opacity:.2;stroke:#3b82f6} .f-green{fill:#22a06b;fill-opacity:.2;stroke:#22a06b}
.f-orange{fill:#d97706;fill-opacity:.2;stroke:#d97706} .f-purple{fill:#8b5cf6;fill-opacity:.2;stroke:#8b5cf6}
.f-red{fill:#dc2626;fill-opacity:.15;stroke:#dc2626}
.f-off{fill:none;stroke:var(--muted,#59636e);stroke-dasharray:3 3;opacity:.6}
.f-ln{stroke:var(--muted,#59636e);fill:none;stroke-width:1.3} .f-dash{stroke-dasharray:5 4}
.f-ah{fill:var(--muted,#59636e)}
</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-ah" d="M0 0L10 5L0 10z"/></marker></defs><line x1="196" y1="20" x2="728" y2="20" class="f-ln"/><text x="462" y="14" class="f-t f-s f-m f-c">three data structures for the same semantics</text><rect x="10" y="30" width="160" height="48" rx="6" class="f-cell"/><text x="90" y="51" class="f-t f-b f-c">TileLang program</text><text x="90" y="68" class="f-t f-s f-m f-c">frontend</text><rect x="196" y="30" width="160" height="48" rx="6" class="f-orange"/><text x="276" y="51" class="f-t f-b f-c">Frontend TIR</text><text x="276" y="68" class="f-t f-s f-m f-c">no lowering passes</text><rect x="382" y="30" width="160" height="48" rx="6" class="f-orange"/><text x="462" y="51" class="f-t f-b f-c">Semantic IR</text><text x="462" y="68" class="f-t f-s f-m f-c">Python dataclasses</text><rect x="568" y="30" width="160" height="48" rx="6" class="f-orange"/><text x="648" y="51" class="f-t f-b f-c">Own Python Tile IR</text><text x="648" y="68" class="f-t f-s f-m f-c">own ops, types, builder</text><line x1="170" y1="54" x2="195" y2="54" class="f-ln" marker-end="url(#ah)"/><line x1="356" y1="54" x2="381" y2="54" class="f-ln" marker-end="url(#ah)"/><line x1="542" y1="54" x2="567" y2="54" class="f-ln" marker-end="url(#ah)"/><line x1="648" y1="78" x2="648" y2="119" class="f-ln" marker-end="url(#ah)"/><rect x="568" y="120" width="160" height="48" rx="6" class="f-cell"/><text x="648" y="141" class="f-t f-b f-c">4 Python passes</text><text x="648" y="158" class="f-t f-s f-m f-c">dataflow, token_order, …</text><rect x="382" y="120" width="160" height="48" rx="6" class="f-cell"/><text x="462" y="141" class="f-t f-b f-c">bytecode</text><text x="462" y="158" class="f-t f-s f-m f-c">tileiras → cubin</text><rect x="196" y="120" width="160" height="48" rx="6" class="f-purple"/><text x="276" y="141" class="f-t f-b f-c">cuTile 1.5 dispatcher</text><text x="276" y="158" class="f-t f-s f-m f-c">own runtime and cache</text><line x1="568" y1="144" x2="543" y2="144" class="f-ln" marker-end="url(#ah)"/><line x1="382" y1="144" x2="357" y2="144" class="f-ln" marker-end="url(#ah)"/><text x="648" y="188" class="f-t f-s f-m f-c">all written in Python</text><text x="276" y="188" class="f-t f-s f-m f-c">launch depends on cuTile&#x27;s internal ABI</text></svg>
