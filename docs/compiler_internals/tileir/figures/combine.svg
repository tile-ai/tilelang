<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" role="img" aria-label="combine: reduce first, then update once" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><style>
