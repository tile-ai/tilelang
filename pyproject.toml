[project]
name = "tilelang"
description = "A tile level programming language to generate high performance code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TileLang Contributors" }, { name = "Tile-AI" }]
maintainers = [{ name = "Lei Wang", email = "leiwang1999@outlook.com" }]
license = "MIT"
keywords = ["BLAS", "CUDA", "HIP", "Code Generation", "TVM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
# mldtypes should be greater than 0.5.1
# if you want to enable fp4
fp4 = ["ml-dtypes>=0.5.1"]
# if you want to enable layout inference visualization
vis = ["matplotlib"]
# if you want to build with CUDA NVCC support
nvcc = [
    "torch",
    "nvidia-cuda-nvcc>=13.0.48; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "nvidia-cuda-nvcc>=13.4.46rc1,<13.5; platform_system == 'Windows' and platform_machine == 'ARM64'",
    "nvidia-cuda-cccl>=13.0.50; platform_system != 'Windows' or platform_machine != 'ARM64'",
    "nvidia-cuda-cccl>=13.3.4.1.2rc1,<13.5; platform_system == 'Windows' and platform_machine == 'ARM64'",
    # On Windows, ship nvrtc through the runtime deps so `pip install tilelang`
    # works without a host CUDA install (TileLang JITs CUDA kernels via nvrtc).
    "nvidia-cuda-nvrtc>=13; platform_system == 'Windows' and platform_machine != 'ARM64'",
    "nvidia-cuda-nvrtc>=13.4.46rc1,<13.5; platform_system == 'Windows' and platform_machine == 'ARM64'",
    # cuRAND is required when kernels use tilelang.cuda.language.random
    "nvidia-curand>=10.4; platform_system == 'Windows' and platform_machine != 'ARM64'",
    "nvidia-curand>=10.4.4.46rc1,<10.5; platform_system == 'Windows' and platform_machine == 'ARM64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine != 'ARM64'", extra = "nvcc" },
]

[build-system]
requires = [
    "cython>=3.1.0",
    "scikit-build-core>=0.11",
    "ninja>=1.11; platform_system == 'Windows'",
]
build-backend = "tilelang_build_backend"
backend-path = ["."]

[tool.scikit-build]
wheel.py-api = "cp39"
cmake.version = ">=3.26.1"
build-dir = "build-python/{wheel_tag}"
install.components = ["tilelang_python"]

# Include backend and git info in version
metadata.version.provider = "version_provider"
metadata.version.provider-path = "."
metadata.dependencies.provider = "provider_metadata"
metadata.dependencies.provider-path = "."
experimental = true

# On Windows, force the Ninja generator so the project's MSVC environment
# activation path runs (it is guarded on `CMAKE_GENERATOR MATCHES "Ninja"`).
# Linux and macOS keep the scikit-build-core default (Makefiles).
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.args = ["-G", "Ninja"]

[tool.scikit-build.cmake.define]
TILELANG_BUILD_COMPILER = "OFF"
TILELANG_BUILD_PYTHON_EXTENSIONS = "ON"

# editable.rebuild = true

# build.verbose = true
# logging.level = "DEBUG"

[tool.scikit-build.sdist]
include = [
    "./VERSION",
    ".git_commit.txt",
    "./LICENSE",
    "THIRDPARTYNOTICES.txt",
    "version_provider.py",
    "provider_metadata.py",
    "tilelang_build_backend.py",
    "tilelang_packaging/**",
    "maint/scripts/build_native_artifacts.py",
    "maint/scripts/verify_native_install.py",
    "requirements*.txt",
    "tilelang/jit/adapter/cython/cython_wrapper.pyx",
    "tilelang/jit/adapter/pto/cython_wrapper.pyx",
    "CMakeLists.txt",
    "src/**",
    "cmake/**",
    # Compiler sources are owned by the separate provider source distribution.
    # CUTLASS
    "3rdparty/cutlass/include",
    "3rdparty/cutlass/tools",
    # Vendored HIP headers (build-time only) so source builds work on hosts
    # without a ROCm install. Not mapped into the wheel at runtime.
    "3rdparty/hip-headers/include",
    "testing/**",
    "examples/**",
]
exclude = [
    ".git",
    ".github",
    "**/.git",
    "**/.github",
    "3rdparty/**",
    "build",
]

[tool.scikit-build.wheel.packages]
tilelang = "tilelang"
"tilelang/src" = "src"
# CUTLASS
"tilelang/3rdparty/cutlass/include" = "3rdparty/cutlass/include"
"tilelang/3rdparty/cutlass/tools" = "3rdparty/cutlass/tools"



[tool.codespell]
ignore-words = "docs/spelling_wordlist.txt"
skip = [
    "build",
    "3rdparty",
    "dist",
    ".venv"
]

[tool.ruff]
target-version = "py310"
line-length = 140
output-format = "full"

exclude = [
    "3rdparty",
    "examples/deepseek_v32/inference",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
# Do not upgrade type hint in testing and examples.
# See https://github.com/tile-ai/tilelang/issues/1079 for more information.
"testing/**.py" = ["UP", "FA"]
"examples/**.py" = ["UP", "FA"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP", "FA",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # if-else-block instead of ternary
    "SIM108",
    # key in dict.keys()
    "SIM118",
    # open file w.o. ctx manager
    "SIM115",
    # memory leaks
    "B019",
    # zip without explicit strict
    "B905",
    # No such file or directory
    "E902",
]

[tool.pytest.ini_options]
verbosity_assertions = 3
filterwarnings = ["always"]
markers = [
    "perf: benchmark and performance API tests skipped by default",
    "slow: long-running correctness sweeps",
    # Feature markers shared with tvm_tirx.testing and backend decorators.
    "pto: tests for the PTO backend",
    "cpu: Mark a test as running on CPU",
    "gpu: Mark a test as using a GPU",
    "multi_gpu: Mark a test as using multiple GPUs",
    "cuda: Mark a test as using CUDA",
    "llvm: Mark a test as using LLVM",
    "metal: Mark a test as using Metal",
    "rocm: Mark a test as using ROCm",
]

[tool.cibuildwheel]
archs = ["auto64"]
skip = "*musllinux*"
build-frontend = "build"
environment = { PYTHONDEVMODE = "1", PYTHONUNBUFFERED = "1" }
environment-pass = [
    "USE_CUDA",
    "CUDA_VERSION",
    "CUDA_PATH",
    "CUDA_HOME",
    "CUDAToolkit_ROOT",
    "NO_VERSION_LABEL",
    "NO_TOOLCHAIN_VERSION",
    "NO_GIT_VERSION",
    "COLUMNS",
    "CMAKE_GENERATOR",
    "CMAKE_BUILD_PARALLEL_LEVEL",
    "FORCE_COLOR",
    "CLICOLOR_FORCE",
]
before-build = 'python -c "import sys; print(sys.version)"'
windows.before-build = 'python -c "import sys; print(sys.version)"'
test-command = [
    'python -c "import tilelang; print(tilelang.__version__)"',
]

[tool.cibuildwheel.linux]
environment.PYTHONDEVMODE = "1"
environment.PYTHONUNBUFFERED = "1"
environment.PATH = "/usr/local/cuda/bin:$PATH"
environment.LD_LIBRARY_PATH = "/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH"
# Build a wheel with CUDA, ROCm, and Ascend support. ROCm uses vendored HIP
# headers and Ascend uses local ACL declarations; both link to runtime stubs,
# so the manylinux container only needs the CUDA toolkit. Execution still
# requires the selected backend's real runtime and device.
environment.USE_CUDA = "ON"
environment.USE_ROCM = "ON"
environment.USE_ASCEND = "ON"
manylinux-x86_64-image  = "manylinux_2_28"  # AlmaLinux 8
manylinux-aarch64-image = "manylinux_2_34"  # Z3 requires
# Install CUDA runtime and stub driver library
# manylinux_2_28 uses gcc 14, which needs CUDA >=12.8
before-all = """
set -eux

cat /etc/*-release
uname -a

case "$(uname -m)" in
    "x86_64")
        DEFAULT_CUDA_VERSION="13.0"
        dnf config-manager --add-repo https://developer.download.nvidia.cn/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
        ;;
    "aarch64")
        DEFAULT_CUDA_VERSION="13.0"
        dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/sbsa/cuda-rhel8.repo
        ;;
    *)
        exit 1
        ;;
esac

cudaver="$(echo "${CUDA_VERSION:-$DEFAULT_CUDA_VERSION}" | cut -d '.' -f-2)"
v="${cudaver//./-}"
dnf install -y "cuda-minimal-build-${v}" "cuda-driver-devel-${v}" "cuda-nvrtc-devel-${v}"
dnf clean all
"""
# Do not bundle libtvm_ffi.so and libz3.so* because they are shipped by the dependency packages.
repair-wheel-command = "auditwheel -v repair --exclude libtvm_ffi.so --exclude 'libz3.so*' --exclude libcuda.so.1 --exclude '/usr/local/cuda*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --verbose --ignore-missing-dependencies --exclude libtvm_ffi.dylib --exclude libz3.dylib --no-sanitize-rpaths --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*linux*x86_64*"
# x86_64 runners in GitHub Actions have limited storage,
# pre-install torch without caching to reduce disk usage during install tilelang.
before-test = [
    "pip install torch --no-cache-dir",
]
